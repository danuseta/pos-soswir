name: pos-soswir

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_db
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - pos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: pos-soswir-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: pos
      DB_NAME: pos_db
    volumes:
      - uploads:/app/uploads/products
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3202:80"
    depends_on:
      - api
    mem_limit: 64m

volumes:
  pos-db:
  uploads:
